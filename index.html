<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคลังข้อสอบออนไลน์</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #4f46e5; --bg: #f3f4f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #1e293b; text-align: center; }
        .hidden { display: none !important; }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn:hover { opacity: 0.9; }
        .btn-sec { background: #64748b; }
        input, select { width: 100%; padding: 10px; margin: 8px 0 15px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .option-btn { display: block; width: 100%; text-align: left; padding: 10px 15px; margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; cursor: pointer; }
        .option-btn:hover { background: #e0e7ff; }
        .user-bar { display: flex; justify-content: space-between; align-items: center; background: #e2e8f0; padding: 10px 15px; border-radius: 6px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <!-- หน้า 1: ล็อกอิน (ระบุชื่อ/อีเมล) -->
    <div id="login-screen">
        <h2>เข้าสู่ระบบทำข้อสอบ</h2>
        <label>ชื่อ-นามสกุล:</label>
        <input type="text" id="user-name" placeholder="กรอกชื่อของคุณ">
        <label>อีเมล:</label>
        <input type="email" id="user-email" placeholder="example@email.com">
        <button class="btn" onclick="login()">เข้าสู่ระบบ</button>
    </div>

    <!-- หน้า 2: เลือกหมวดหมู่ / ดูสถิติ -->
    <div id="main-screen" class="hidden">
        <div class="user-bar">
            <span id="display-user"></span>
            <button onclick="logout()" style="padding: 4px 8px; cursor:pointer;">ออกจากระบบ</button>
        </div>
        <h2>เลือกหมวดหมู่ข้อสอบ</h2>
        <select id="category-select">
            <option value="ความรู้ทั่วไป">ความรู้ทั่วไป</option>
            <option value="ภาษาอังกฤษ">ภาษาอังกฤษ</option>
            <option value="กฎหมายน่ารู้">กฎหมายน่ารู้</option>
        </select>
        <button class="btn" onclick="startQuiz()">เริ่มทำข้อสอบ</button>
        <button class="btn btn-sec" onclick="loadHistory()">📊 ดูสถิติของฉัน</button>
    </div>

    <!-- หน้า 3: ทำข้อสอบ -->
    <div id="quiz-screen" class="hidden">
        <h3 id="quiz-title">ข้อสอบ</h3>
        <p id="question-text" style="font-size: 18px; font-weight: bold;"></p>
        <div id="options-container"></div>
    </div>

    <!-- หน้า 4: สรุปผล -->
    <div id="result-screen" class="hidden">
        <h2>ผลการทดสอบ</h2>
        <p id="score-text" style="font-size: 24px; text-align: center; color: var(--primary);"></p>
        <p id="status-text" style="text-align: center; color: #64748b;"></p>
        <button class="btn" onclick="showMainScreen()">กลับหน้าหลัก</button>
    </div>

    <!-- หน้า 5: สถิติ/กราฟ -->
    <div id="stats-screen" class="hidden">
        <h2>สถิติการสอบย้อนหลัง</h2>
        <canvas id="statsChart" style="max-height: 300px;"></canvas>
        <button class="btn btn-sec" onclick="showMainScreen()">ปิดหน้าสถิติ</button>
    </div>
</div>

<script>
    // 🔗 วาง Web App URL จาก Apps Script ที่นี่
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz5lRYr5_jAziCr8L1sgVtCuFn76ugyhgmrCGSFKTNfkKurCqDx_j8vdiXsh2R4Eeb0/exec";

    // คลังข้อสอบตัวอย่าง
    const quizData = [
        { q: "1 + 1 เท่ากับเท่าไร?", options: ["1", "2", "3", "4"], answer: 1 },
        { q: "เมืองหลวงของประเทศไทยคือเมืองใด?", options: ["เชียงใหม่", "ชลบุรี", "กรุงเทพฯ", "ภูเก็ต"], answer: 2 },
        { q: "HTML ย่อมาจากอะไร?", options: ["Hyper Text Markup Language", "High Text Marking Language", "Hyperlinks Textual Mark", "Home Tool Markup"], answer: 0 }
    ];

    let currentUser = null;
    let currentQuestionIndex = 0;
    let score = 0;
    let statsChartInstance = null;

    // เช็กข้อมูลผู้ใช้เดิม
    window.onload = () => {
        const savedUser = localStorage.getItem("quiz_user");
        if (savedUser) {
            currentUser = JSON.parse(savedUser);
            showMainScreen();
        }
    };

    function login() {
        const name = document.getElementById("user-name").value.trim();
        const email = document.getElementById("user-email").value.trim();

        if (!name || !email) {
            alert("กรุณากรอกชื่อและอีเมลให้ครบถ้วน");
            return;
        }

        currentUser = { name, email };
        localStorage.setItem("quiz_user", JSON.stringify(currentUser));
        showMainScreen();
    }

    function logout() {
        localStorage.removeItem("quiz_user");
        currentUser = null;
        document.getElementById("login-screen").classList.remove("hidden");
        document.getElementById("main-screen").classList.add("hidden");
    }

    function showMainScreen() {
        hideAllScreens();
        document.getElementById("main-screen").classList.remove("hidden");
        document.getElementById("display-user").innerText = `👤 ${currentUser.name}`;
    }

    function hideAllScreens() {
        ["login-screen", "main-screen", "quiz-screen", "result-screen", "stats-screen"].forEach(id => {
            document.getElementById(id).classList.add("hidden");
        });
    }

    function startQuiz() {
        hideAllScreens();
        document.getElementById("quiz-screen").classList.remove("hidden");
        currentQuestionIndex = 0;
        score = 0;
        loadQuestion();
    }

    function loadQuestion() {
        const q = quizData[currentQuestionIndex];
        document.getElementById("question-text").innerText = `ข้อ ${currentQuestionIndex + 1}: ${q.q}`;
        const container = document.getElementById("options-container");
        container.innerHTML = "";

        q.options.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => selectAnswer(idx);
            container.appendChild(btn);
        });
    }

    function selectAnswer(selectedIndex) {
        if (selectedIndex === quizData[currentQuestionIndex].answer) {
            score++;
        }

        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        hideAllScreens();
        document.getElementById("result-screen").classList.remove("hidden");
        document.getElementById("score-text").innerText = `ได้คะแนน ${score} / ${quizData.length}`;
        document.getElementById("status-text").innerText = "กำลังบันทึกผลลง Google Sheets...";

        const category = document.getElementById("category-select").value;

        // ส่งข้อมูลไปบันทึกลง Google Sheet
        fetch(GAS_WEB_APP_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
                name: currentUser.name,
                email: currentUser.email,
                category: category,
                score: score,
                total: quizData.length
            })
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById("status-text").innerText = "บันทึกผลคะแนนเรียบร้อยแล้ว!";
        })
        .catch(err => {
            console.error(err);
            document.getElementById("status-text").innerText = "บันทึกผลสำเร็จ (หรืออยู่นอกระบบเชื่อมต่อ)";
        });
    }

    function loadHistory() {
        hideAllScreens();
        document.getElementById("stats-screen").classList.remove("hidden");

        // ดึงสถิติตาม Email ของผู้ใช้ปัจจุบัน
        fetch(`${GAS_WEB_APP_URL}?email=${encodeURIComponent(currentUser.email)}`)
        .then(res => res.json())
        .then(data => {
            if (data.status === "success" && data.history) {
                renderChart(data.history);
            }
        })
        .catch(err => console.error(err));
    }

    function renderChart(historyData) {
        const ctx = document.getElementById('statsChart').getContext('2d');
        
        const labels = historyData.map((item, idx) => `ครั้งที่ ${idx + 1} (${item.category})`);
        const scores = historyData.map(item => item.score);

        if (statsChartInstance) {
            statsChartInstance.destroy();
        }

        statsChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'คะแนนที่ได้',
                    data: scores,
                    borderColor: '#4f46e5',
                    backgroundColor: 'rgba(79, 70, 229, 0.1)',
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: { beginAtZero: true, max: 3 }
                }
            }
        });
    }
</script>

</body>
</html>
